[project]
name = "churnguard"
version = "0.1.0"
description = "End-to-end churn prediction and retention platform on KKBox"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "pandas>=2.2",
    "pandera>=0.20",
    "pyyaml>=6",
    "kaggle>=1.6",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "optuna>=4.0",
    "mlflow>=2.17",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churnguard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Deprecations become failures: they are tomorrow's production errors.
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:mlflow.*",
    "ignore::DeprecationWarning:optuna.*",
    # Raised by MLflow's own pyfunc modules at import time (message starts with an ANSI code).
    "ignore:.*Any type hint is inferred as AnyType:UserWarning",
]
