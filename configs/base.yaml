# ChurnGuard base configuration. Paths are relative to the project root.
paths:
  raw: data/raw
  bronze: data/bronze
  silver: data/silver
  gold: data/gold
  reports: reports
  models: models

kaggle:
  competition: kkbox-churn-prediction-challenge

ingest:
  # Inclusive month window "YYYY-MM". null = everything. Applies to time-partitioned tables.
  # Start small (e.g. 2016-10 .. 2017-03) if disk or RAM is tight.
  month_start: null
  month_end: null
  # Bytes per CSV read block. ~64 MB blocks ≈ 1.2M user_log rows.
  csv_block_size: 67108864
  # Rows buffered per month partition before flushing a row group. Worst case memory is
  # ~(#months x flush_rows x ~100 B) when logs are not date-sorted: ~1.5 GB at 500k.
  flush_rows: 500000
  # Rows sampled from each batch for Pandera validation (full-batch checks are vectorised).
  validate_sample_rows: 20000
  compression: zstd
  # Abort before starting if free disk drops below this (GB).
  min_free_disk_gb: 8

duckdb:
  # 16 GB laptop: leave headroom for the OS + apps, or macOS swaps (swap eats disk space).
  memory_limit: 6GB
  threads: 6

storage:
  # Cold storage for raw/bronze via rclone (see `make archive` / `make restore`).
  remote: "gdrive:ChurnGuard"
  transfers: 4

modeling:
  # Time-ordered splits by label month. Never shuffle across months.
  train_months: ["2016-10", "2016-11", "2016-12", "2017-01"]
  valid_month: "2017-02"
  test_month: "2017-03"     # labels from official train_v2 (our March labels are immature)
  train_sample: 1000000     # in-memory models on a 16 GB laptop; null = all decided rows
  seed: 42
  tuning_trials: 25         # Optuna trials over 3 rolling folds inside train months
  tuning_timeout_s: 1800

mlflow:
  tracking_uri: "sqlite:///mlruns.db"   # experiments + model registry; artifacts in mlartifacts/
  experiment: churnguard
  registered_model: churnguard     # any model type; see the model_type version tag

retention:
  # EV_i = p_i * save_rate * CLV_i - cost_i. save_rate is an ASSUMPTION (KKBox has no campaign
  # data): run a randomised holdout before trusting any money figure.
  save_rate: 0.20
  horizon_months: 12
  baseline_monthly_churn: 0.06
  contact_cost: 2.0         # NTD per contacted member
  incentive_months: 1.0     # free months offered to each contacted member
  budget: null              # NTD per campaign; null = every positive-EV member

monitoring:
  reference_sample: 200000     # rows from the champion's training months
  score_psi_warn: 0.10
  score_psi_retrain: 0.25
  major_features_retrain: 3    # features with PSI > 0.25
  auc_drop_retrain: 0.03       # matured AUC vs champion out-of-time mean AUC
  ece_retrain: 0.02
  volume_ratio: [0.5, 2.0]     # scored population vs reference monthly average
  null_jump_warn: 0.10
