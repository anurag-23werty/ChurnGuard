# Feature registry: the contract between feature code, models, and docs.
# The builder fails if it produces a column not listed here, or misses one that is.
#
# Every feature is computed as of `as_of_date` (first day of the label month) from events
# strictly before it. `source` names the silver table and `window_days` the look-back
# (null = all history before as_of_date, or a static attribute).
#
# Expansion: entries with `windows: [...]` expand to one feature per window, named
# <name>_<w>d. A `{w}` in the description is replaced by the window.

families:
  member:
    source: members
    note: >
      silver/members is an end-of-period snapshot; city/gender/registered_via are assumed
      time-invariant. registration_date can lie after as_of_date (late registrations up to
      2017-04-29), so tenure is NULL in that case instead of negative.
    features:
      - {name: city, dtype: int, description: City code}
      - {name: age, dtype: int, description: Age in years; NULL outside 10-80}
      - {name: age_missing, dtype: int, description: 1 if age is NULL}
      - {name: gender, dtype: str, description: "male / female / unknown"}
      - {name: registered_via, dtype: int, description: Registration channel code}
      - {name: tenure_days, dtype: int, description: Days from registration to as_of_date; NULL if registration is after it}
      - {name: has_member_record, dtype: int, description: 1 if the member exists in members (11% do not)}

  billing:
    source: transactions
    features:
      - {name: days_to_expiry, dtype: int, description: Days from as_of_date to paid-through date (from the spine)}
      - {name: last_plan_days, dtype: int, description: Plan length of the last transaction before as_of_date}
      - {name: last_list_price, dtype: int, description: List price of the last transaction}
      - {name: last_amount_paid, dtype: int, description: Amount paid in the last transaction}
      - {name: last_discount, dtype: int, description: List price minus amount paid, last transaction}
      - {name: last_is_auto_renew, dtype: int, description: Auto-renew flag of the last transaction}
      - {name: last_is_cancel, dtype: int, description: 1 if the last transaction was a cancellation}
      - {name: last_payment_method, dtype: int, description: Payment method of the last transaction}
      - {name: days_since_last_txn, dtype: int, description: Days from the last transaction to as_of_date}
      - {name: days_since_first_txn, dtype: int, description: Days from the first transaction to as_of_date}
      - {name: n_txn, dtype: int, windows: [30, 90, 180, 365], description: "Transactions in the last {w} days"}
      - {name: n_cancel, dtype: int, windows: [30, 90, 180, 365], description: "Cancellations in the last {w} days"}
      - {name: amount_paid, dtype: int, windows: [90, 365], description: "Total paid in the last {w} days"}
      - {name: n_free_txn, dtype: int, windows: [365], description: "Transactions with amount_paid = 0 in the last {w} days"}
      - {name: auto_renew_share, dtype: float, windows: [180], description: "Share of transactions with auto-renew in the last {w} days"}
      - {name: n_cancel_all, dtype: int, description: Cancellations over all history}
      - {name: n_payment_methods, dtype: int, description: Distinct payment methods over all history}

  engagement:
    source: user_logs
    note: >
      silver/user_logs starts 2016-07-01, so windows are capped at 90 days (every as_of_date
      from 2016-10 onward has full coverage).
    features:
      - {name: active_days, dtype: int, windows: [7, 14, 30, 90], description: "Days with any listening in the last {w} days"}
      - {name: total_secs, dtype: float, windows: [7, 14, 30, 90], description: "Seconds listened in the last {w} days"}
      - {name: num_unq, dtype: int, windows: [7, 30, 90], description: "Sum of daily unique songs in the last {w} days"}
      - {name: num_plays, dtype: int, windows: [7, 30, 90], description: "Plays (all completion buckets) in the last {w} days"}
      - {name: completion_rate, dtype: float, windows: [30, 90], description: "num_100 / all plays in the last {w} days"}
      - {name: skip_rate, dtype: float, windows: [30], description: "num_25 / all plays in the last {w} days"}
      - {name: secs_per_active_day, dtype: float, windows: [30], description: "total_secs / active_days over {w} days"}
      - {name: days_since_last_listen, dtype: int, description: Days from the last listening day to as_of_date (NULL if none in 90 days)}
      - {name: secs_trend_7_30, dtype: float, description: "Last-7-day secs vs the 30-day weekly average (1 = flat, <1 = declining)"}
      - {name: active_trend_7_30, dtype: float, description: Last-7-day active days vs the 30-day weekly average}
