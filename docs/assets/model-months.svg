<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t d">
  <title id="t">Out-of-time ROC AUC by month</title>
  <desc id="d">Logistic regression 0.959, 0.832, 0.899, 0.893; LightGBM 0.964, 0.781, 0.908, 0.915; blend 0.963, 0.806, 0.904, 0.908 for Nov 2016, Dec 2016, Jan 2017 and Feb 2017. All trees fall furthest in December 2016.</desc>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
    .ax{font:400 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#868a9b}
    .lb{font-size:13px;fill:#a2a6b4}
    .v{font:500 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#ecedf2}
    .bar{transform-box:fill-box;transform-origin:50% 100%;animation:g 1.1s cubic-bezier(.2,.7,.2,1) both}
    @keyframes g{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    .val{opacity:0;animation:o .4s ease forwards}
    @keyframes o{to{opacity:1}}
    .band{animation:b 2.6s ease-in-out infinite}
    @keyframes b{0%,100%{opacity:.35}50%{opacity:.7}}
    @media (prefers-reduced-motion:reduce){.bar,.band{animation:none}.val{animation:none;opacity:1}}
  </style>
  <rect width="900" height="360" rx="20" fill="#0b0c10"/>
  <rect x=".5" y=".5" width="899" height="359" rx="19.5" fill="none" stroke="#23262f"/>
  <text x="28" y="40" style="font-size:17px;font-weight:600;fill:#ecedf2">Out-of-time ROC AUC: steady months vs the shift month</text>
  <text x="28" y="62" class="lb">each month scored by a model trained only on earlier months</text>

  <rect class="band" x="292" y="78" width="156" height="206" rx="10" fill="#2e2410"/>
  <text x="370" y="96" text-anchor="middle" style="font-size:12px;font-weight:600;fill:#f8c866">Dec 2016 · concept drift</text>

  <g stroke="#1f222a"><line x1="70" y1="280" x2="870" y2="280"/><line x1="70" y1="230" x2="870" y2="230"/><line x1="70" y1="180" x2="870" y2="180"/><line x1="70" y1="130" x2="870" y2="130"/></g>
  <g class="ax" text-anchor="end"><text x="62" y="284">0.75</text><text x="62" y="234">0.80</text><text x="62" y="184">0.85</text><text x="62" y="134">0.90</text><text x="62" y="84">0.95</text></g>
  <line x1="70" y1="80" x2="870" y2="80" stroke="#1f222a"/>

  <!-- y = 280 - (v-0.75)/0.20*200 -->
  <!-- Nov -->
  <rect class="bar" x="128" y="71" width="36" height="209" rx="4" fill="#9b8cff" style="animation-delay:.05s"/>
  <rect class="bar" x="170" y="66" width="36" height="214" rx="4" fill="#3dd9e3" style="animation-delay:.1s"/>
  <rect class="bar" x="212" y="67" width="36" height="213" rx="4" fill="#5e6372" style="animation-delay:.15s"/>
  <!-- Dec -->
  <rect class="bar" x="328" y="198" width="36" height="82" rx="4" fill="#9b8cff" style="animation-delay:.25s"/>
  <rect class="bar" x="370" y="249" width="36" height="31" rx="4" fill="#3dd9e3" style="animation-delay:.3s"/>
  <rect class="bar" x="412" y="224" width="36" height="56" rx="4" fill="#5e6372" style="animation-delay:.35s"/>
  <!-- Jan -->
  <rect class="bar" x="528" y="131" width="36" height="149" rx="4" fill="#9b8cff" style="animation-delay:.45s"/>
  <rect class="bar" x="570" y="122" width="36" height="158" rx="4" fill="#3dd9e3" style="animation-delay:.5s"/>
  <rect class="bar" x="612" y="126" width="36" height="154" rx="4" fill="#5e6372" style="animation-delay:.55s"/>
  <!-- Feb -->
  <rect class="bar" x="728" y="137" width="36" height="143" rx="4" fill="#9b8cff" style="animation-delay:.65s"/>
  <rect class="bar" x="770" y="115" width="36" height="165" rx="4" fill="#3dd9e3" style="animation-delay:.7s"/>
  <rect class="bar" x="812" y="122" width="36" height="158" rx="4" fill="#5e6372" style="animation-delay:.75s"/>

  <g class="v val" text-anchor="middle" style="animation-delay:1.1s">
    <text x="146" y="66">.959</text><text x="188" y="61">.964</text><text x="230" y="62">.963</text>
    <text x="346" y="192" style="fill:#c9c1ff">.832</text><text x="388" y="243">.781</text><text x="430" y="218">.806</text>
    <text x="546" y="126">.899</text><text x="588" y="117">.908</text><text x="630" y="121">.904</text>
    <text x="746" y="132">.893</text><text x="788" y="110">.915</text><text x="830" y="117">.908</text>
  </g>
  <g class="lb" text-anchor="middle"><text x="188" y="302">Nov 2016</text><text x="388" y="302">Dec 2016</text><text x="588" y="302">Jan 2017</text><text x="788" y="302">Feb 2017</text></g>

  <g transform="translate(70 326)" class="lb">
    <rect width="12" height="12" rx="3" fill="#9b8cff"/><text x="18" y="11">Logistic regression (champion) · mean 0.896 · worst 0.832</text>
    <rect x="410" width="12" height="12" rx="3" fill="#3dd9e3"/><text x="428" y="11">LightGBM · worst 0.781</text>
    <rect x="600" width="12" height="12" rx="3" fill="#5e6372"/><text x="618" y="11">Blend · worst 0.806</text>
  </g>
</svg>
