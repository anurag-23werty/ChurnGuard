<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">ChurnGuard</title>
  <desc id="d">Churn prediction and value-based retention for KKBox: 410M rows, 52 point-in-time features, mean out-of-time AUC 0.896, 1.01M members scored in 19 seconds.</desc>
  <defs>
    <radialGradient id="glow" cx="78%" cy="40%" r="60%">
      <stop offset="0" stop-color="#2a2350" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0b0c10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3dd9e3"/>
      <stop offset="1" stop-color="#9b8cff"/>
    </linearGradient>
    <style>
      .t{font:600 56px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#ecedf2;letter-spacing:-1.5px}
      .s{font:400 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#a2a6b4}
      .chip{font:500 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#ecedf2}
      .lab{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#a2a6b4}
      .eq rect{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.6s ease-in-out infinite alternate}
      @keyframes eq{0%{transform:scaleY(.25)}100%{transform:scaleY(1)}}
      .fade{opacity:0;animation:in .8s ease forwards}
      @keyframes in{to{opacity:1}}
      .pulse{animation:p 2.4s ease-in-out infinite}
      @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.eq rect,.pulse{animation:none}.fade{animation:none;opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="20" fill="#0b0c10"/>
  <rect width="1200" height="300" rx="20" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="299" rx="19.5" fill="none" stroke="#23262f"/>

  <!-- equaliser: a music service losing listeners -->
  <g class="eq">
    <g fill="url(#bar)">
      <rect x="820" y="70" width="14" height="160" rx="4" style="animation-delay:-.1s"/>
      <rect x="846" y="70" width="14" height="160" rx="4" style="animation-delay:-.7s"/>
      <rect x="872" y="70" width="14" height="160" rx="4" style="animation-delay:-1.2s"/>
      <rect x="898" y="70" width="14" height="160" rx="4" style="animation-delay:-.4s"/>
      <rect x="924" y="70" width="14" height="160" rx="4" style="animation-delay:-1s"/>
      <rect x="950" y="70" width="14" height="160" rx="4" style="animation-delay:-.2s"/>
      <rect x="976" y="70" width="14" height="160" rx="4" style="animation-delay:-1.4s"/>
      <rect x="1002" y="70" width="14" height="160" rx="4" style="animation-delay:-.6s"/>
      <rect x="1028" y="70" width="14" height="160" rx="4" style="animation-delay:-.9s"/>
      <rect x="1054" y="70" width="14" height="160" rx="4" style="animation-delay:-.3s"/>
    </g>
    <rect x="1080" y="70" width="14" height="160" rx="4" fill="#f5b53d" style="animation-delay:-1.1s"/>
    <rect x="1106" y="70" width="14" height="160" rx="4" fill="#f5b53d" style="animation-delay:-.5s;animation-duration:2.2s"/>
  </g>
  <text x="1100" y="258" class="lab" text-anchor="middle">at risk</text>

  <g transform="translate(64 0)">
    <rect x="0" y="62" width="44" height="44" rx="12" fill="#2a2350"/>
    <path d="M10 81v6M16 76v16M22 70v28M28 77v14M34 82v4" stroke="#9b8cff" stroke-width="3" stroke-linecap="round" fill="none"/>
    <text x="60" y="102" class="t">ChurnGuard</text>
    <text x="0" y="146" class="s fade" style="animation-delay:.2s">Who is about to cancel, and who is worth saving?</text>
    <text x="0" y="174" class="s fade" style="animation-delay:.4s">KKBox churn prediction → value-based retention → monitoring</text>

    <g class="fade" style="animation-delay:.7s">
      <rect x="0" y="206" width="176" height="52" rx="10" fill="#14161c" stroke="#23262f"/>
      <text x="14" y="228" class="lab">rows ingested</text>
      <text x="14" y="248" class="chip">410M</text>
    </g>
    <g class="fade" style="animation-delay:.85s">
      <rect x="188" y="206" width="176" height="52" rx="10" fill="#14161c" stroke="#23262f"/>
      <text x="202" y="228" class="lab">out-of-time AUC</text>
      <text x="202" y="248" class="chip">0.896</text>
    </g>
    <g class="fade" style="animation-delay:1s">
      <rect x="376" y="206" width="176" height="52" rx="10" fill="#14161c" stroke="#23262f"/>
      <text x="390" y="228" class="lab">members scored</text>
      <text x="390" y="248" class="chip">1.01M in 19 s</text>
    </g>
    <g class="fade" style="animation-delay:1.15s">
      <rect x="564" y="206" width="176" height="52" rx="10" fill="#17152a" stroke="#2b2650"/>
      <text x="578" y="228" class="lab">EV backtest</text>
      <text x="578" y="248" class="chip" fill="#7fe6ec" style="fill:#7fe6ec">+976k NTD</text>
    </g>
  </g>
  <circle cx="1136" cy="40" r="5" fill="#3dd9e3" class="pulse"/>
  <text x="1124" y="44" class="lab" text-anchor="end">monitoring: ok</text>
</svg>
